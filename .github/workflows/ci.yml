name: CI

on:
  push:
    branches: [main]
  # branches を指定しない = **どのブランチ宛の PR でも走る**。
  #
  # 以前は `branches: [main]` だった ∴ develop 宛の PR では CI が一度も
  # 回らないまま develop に溜まり、main への統合 PR で初めてまとめて走る
  # ——— そこで落ちると、どの PR が原因かの切り分けが最後にまとめて来る。
  # 個別の PR を緑にしてから積める形に戻す。
  #
  # 先例は spirrow-voxelworld (V-4: feature -> develop -> release -> main)。
  # あちらの main-base-guard.yml が `branches: [main]` なのは意図的で、
  # **main 宛の PR を検査する門**だから ——— あれを全ブランチにすると門が壊れる。
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Gate (single SOT — see .mindwire-gate)
        # CI runs the gate script rather than restating what it does, so CI and
        # the autonomous loop's implementer cannot judge a change differently.
        # Adding a check means editing .mindwire-gate; there is no second place.
        #
        # UV_PYTHON is how the matrix reaches the `uv run` inside the script
        # without the script needing to know a matrix is running it — the loop's
        # implementer executes the same `bash .mindwire-gate` with UV_PYTHON
        # unset and gets the interpreter uv resolves from `requires-python`.
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: bash .mindwire-gate
