# Magickit Configuration for AIサーバー

server:
  host: "0.0.0.0"
  port: 8113
  debug: false

# MCP Server Configuration
mcp:
  port: 8114

services:
  # Timeouts cover worst-case latency, not typical latency.
  # smart_create_document on a 40KB body hits Drive API + BGE-M3
  # embedding + Qdrant write serially and can take 60-120s.
  lexora:
    url: "http://localhost:8110"
    timeout: 240.0
  cognilens:
    url: "http://localhost:8111"
    timeout: 240.0
  prismind:
    url: "http://localhost:8112"
    timeout: 360.0

database:
  path: "data/magickit.db"

logging:
  level: "INFO"
  format: "json"

task_queue:
  max_concurrent: 5
  default_priority: 5
  max_retries: 3

# Phase 2 機能
auth:
  enabled: false
  # jwt_secret: 環境変数 MAGICKIT_JWT_SECRET で設定してください
  jwt_expire_minutes: 60

# 稼働状況ページ (/dashboard)
ops:
  # 直近の chatroom 活動もループの heartbeat も、これだけ途絶えたら
  # 「停止疑い」と表示する。1 ターン (実装なら数分) をまたげる長さで、
  # かつ「夜中に落ちていた」を翌朝まで気づかない長さにはしない。
  # これは推測であって観測ではない (web/ops.py を参照)。
  stall_minutes: 30
